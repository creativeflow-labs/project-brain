services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: projectbrain
      POSTGRES_USER: projectbrain
      POSTGRES_PASSWORD: projectbrain
    ports:
      - "54329:5432"
    volumes:
      - project_brain_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectbrain -d projectbrain"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://projectbrain:projectbrain@db:5432/projectbrain
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  project_brain_db:

